<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Animated developer ID card</title><desc id="desc">A swinging lanyard and illustrated bat-themed avatar with barcode, no unverified metrics.</desc>
<defs><linearGradient id="i-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f2ff"/><stop offset=".45" stop-color="#687d9b"/><stop offset=".7" stop-color="#d6e5f7"/><stop offset="1" stop-color="#536784"/></linearGradient><linearGradient id="i-card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c33"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="i-border"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><linearGradient id="i-foil"><stop stop-color="#247bff" stop-opacity="0"/><stop offset=".5" stop-color="#b7d9ff" stop-opacity=".2"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></linearGradient></defs>
<style>.t{font-family:Inter,Arial,sans-serif;fill:#f5f7ff}.m{font-family:Inter,Arial,sans-serif;fill:#b8c7e8}@keyframes i-drop{0%{transform:translateY(-80px) rotate(-8deg);opacity:0}70%{transform:translateY(8px) rotate(3deg);opacity:1}85%{transform:translateY(-3px) rotate(-1deg)}100%{transform:translateY(0) rotate(0);opacity:1}}.lanyard{transform-origin:600px 25px;animation:i-drop 1.5s cubic-bezier(.2,.7,.2,1) both, i-swing 5s 1.5s ease-in-out infinite}@keyframes i-swing{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}.sweep{animation:i-sweep 5s 1.8s ease-in-out infinite}@keyframes i-sweep{0%,100%{transform:translateX(-500px);opacity:0}20%,70%{opacity:1}90%{transform:translateX(500px);opacity:0}}@media(prefers-reduced-motion:reduce){.lanyard,.sweep{animation:none!important}}</style>
<rect width="1200" height="400" rx="24" fill="#070b16"/><rect x="8" y="8" width="1184" height="384" rx="20" fill="none" stroke="url(#i-border)" stroke-width="1.5"/>
<g class="lanyard">
<path d="M500 20L555 100 600 124 645 100 700 20" fill="none" stroke="#247bff" stroke-width="12" stroke-linecap="round"/><path d="M500 20L555 100 600 124 645 100 700 20" fill="none" stroke="#7eb7ff" stroke-opacity=".55" stroke-width="2"/>
<rect x="574" y="113" width="52" height="38" rx="8" fill="url(#i-metal)" stroke="#e8f2ff"/><rect x="586" y="121" width="28" height="23" rx="6" fill="#070b16" stroke="#8094b2"/><path d="M590 133v-5a10 10 0 0 1 20 0v5" fill="none" stroke="#b8c7e8" stroke-width="3"/>
<g transform="translate(420 145)"><rect x="0" y="0" width="360" height="220" rx="20" fill="url(#i-card)" stroke="url(#i-border)" stroke-width="2"/><path d="M15 15h330v190H15Z" fill="none" stroke="#263d64"/>
<text class="m" x="24" y="32" font-size="11" letter-spacing="3">DEVELOPER ACCESS</text>
<rect x="24" y="48" width="110" height="120" rx="12" fill="#0c1425" stroke="#247bff"/>
<!-- original bat-themed avatar -->
<path d="M40 151l-5-40 15 7 7-25 15 10 11-33 13 24 14-12 8 34 15-6-6 39Z" fill="#111d33" stroke="#247bff" stroke-width="1.5"/><path d="M56 103l7-27 13 17 18-1 12-18 8 30-10 25-18 12-19-12Z" fill="#080e1b" stroke="#506d9a"/><path d="M63 109l13 3-7 5-6-2m22-3l13-3-5 6-8 2" fill="#e4eeff"/>
<text class="t" x="154" y="74" font-size="19" font-weight="800">MUHAMMAD HAZIQ</text><text class="t" x="154" y="99" font-size="19" font-weight="800">IMRAN</text><text class="m" x="154" y="125" font-size="14">AI ENGINEER</text><text class="m" x="154" y="146" font-size="12">Sadiqabad, Pakistan</text>
<g transform="translate(154 162)" fill="#f5f7ff"><rect width="2" height="24"/><rect x="5" width="1" height="24"/><rect x="9" width="3" height="24"/><rect x="16" width="1" height="24"/><rect x="20" width="4" height="24"/><rect x="28" width="2" height="24"/><rect x="34" width="1" height="24"/><rect x="39" width="3" height="24"/><rect x="46" width="1" height="24"/><rect x="50" width="2" height="24"/><rect x="56" width="4" height="24"/><rect x="64" width="1" height="24"/><rect x="68" width="3" height="24"/><rect x="75" width="1" height="24"/><rect x="80" width="4" height="24"/><rect x="88" width="2" height="24"/><rect x="94" width="1" height="24"/><rect x="99" width="3" height="24"/><rect x="106" width="1" height="24"/><rect x="110" width="4" height="24"/><rect x="118" width="2" height="24"/><rect x="124" width="1" height="24"/><rect x="128" width="3" height="24"/><rect x="135" width="1" height="24"/><rect x="140" width="4" height="24"/><rect x="148" width="2" height="24"/></g>
<rect class="sweep" x="0" y="0" width="90" height="220" fill="url(#i-foil)" opacity=".5"/>
</g></g>
<text class="m" x="600" y="382" font-size="12" text-anchor="middle">NO UNVERIFIED COUNTS OR CLAIMS</text>
</svg>