<text class="t" x="42" y="55" font-size="26" font-weight="800">ABOUT ME</text><path d="M42 74h485" stroke="#243552"/><text class="m" x="42" y="113" font-size="18">I build practical AI workflows,</text><text class="m" x="42" y="139" font-size="18">agent systems, and developer tools.</text>
