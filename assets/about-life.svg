<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">About Haziq and interests</title><desc id="desc">About section with capabilities and three illustrated interests: AI exploration, UFC, and Tash.</desc>
<defs><linearGradient id="a-border"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="a-dot" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#247bff" opacity=".25"/></pattern></defs>
<style>.t{font-family:Inter,Arial,sans-serif;fill:#f5f7ff}.m{fill:#b8c7e8}.slide{opacity:0;animation:a-slides 12s infinite}.s1{animation-delay:0s}.s2{animation-delay:4s}.s3{animation-delay:8s}@keyframes a-slides{0%,5%{opacity:0;transform:translateX(12px)}10%,28%{opacity:1;transform:translateX(0)}33%,100%{opacity:0;transform:translateX(-10px)}}@media(prefers-reduced-motion:reduce){.slide{animation:none!important;opacity:0}.s1{opacity:1!important}}</style>
