<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Haziq Imran — AI Engineer</title><desc id="desc">Animated dark navy profile hero with a stylized bat-themed cartoon hero, role rotation, and location.</desc>
<defs>
 <linearGradient id="h-border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#354cff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="h-name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f5f7ff"/><stop offset=".62" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <radialGradient id="h-glow"><stop stop-color="#247bff" stop-opacity=".28"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
 <pattern id="h-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#247bff" opacity=".4"/></pattern>
 <clipPath id="h-clip"><rect x="8" y="8" width="1184" height="314" rx="24"/></clipPath>
</defs>
<style>
.text{font-family:Inter,Arial,sans-serif;fill:#f5f7ff}.muted{fill:#b8c7e8}.role{opacity:0;animation:h-role 16s infinite}.r1{animation-delay:0s}.r2{animation-delay:4s}.r3{animation-delay:8s}.r4{animation-delay:12s}
@keyframes h-role{0%,3%{opacity:0;transform:translateY(8px)}8%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes h-rise{from{opacity:0;transform:translateY(42px);clip-path:inset(100% 0 0 0)}to{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0)}}
.name{animation:h-rise 1.15s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){.role,.name{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}.role{display:none}.r1{display:inline}}
</style>
<rect width="1200" height="330" rx="26" fill="#070b16"/><g clip-path="url(#h-clip)"><rect width="1200" height="330" fill="url(#h-dots)" opacity=".45"/><circle cx="930" cy="155" r="270" fill="url(#h-glow)"/><path d="M710 330L1000 0h200v330Z" fill="#0a1530" opacity=".65"/><path d="M920 0L760 330M1100 0L940 330" stroke="#247bff" stroke-opacity=".15" stroke-width="2"/></g>
