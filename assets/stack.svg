<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Technology stack</title><desc id="desc">Labeled technology orbit diagram and grouped stack chips.</desc>
<defs><linearGradient id="s-border"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><linearGradient id="s-blue"><stop stop-color="#247bff"/><stop offset="1" stop-color="#5ca8ff"/></linearGradient></defs>
<style>.t{font-family:Inter,Arial,sans-serif;fill:#f5f7ff}.m{font-family:Inter,Arial,sans-serif;fill:#b8c7e8}.chip{fill:#101a30;stroke:#2c456c}</style>
<rect width="1200" height="390" rx="24" fill="#070b16"/><rect x="8" y="8" width="1184" height="374" rx="20" fill="none" stroke="url(#s-border)" stroke-width="1.5"/>
<text class="t" x="42" y="52" font-size="26" font-weight="800">TECH STACK</text><text class="m" x="42" y="78" font-size="16">The tools I use to build AI systems</text>
<g transform="translate(330 205)"><ellipse rx="240" ry="105" fill="none" stroke="#247bff" stroke-opacity=".55" stroke-width="2" transform="rotate(-18)"/><ellipse rx="240" ry="105" fill="none" stroke="#ff354f" stroke-opacity=".4" stroke-width="2" transform="rotate(42)"/><ellipse rx="180" ry="75" fill="none" stroke="#344c78" stroke-dasharray="5 8" transform="rotate(90)"/>
<circle r="57" fill="#0e1a31" stroke="#247bff" stroke-width="2"/><text class="t" text-anchor="middle" y="-2" font-size="15" font-weight="800">AI</text><text class="m" text-anchor="middle" y="19" font-size="12">ENGINEERING</text>
<g transform="translate(-205 -60)"><circle r="33" fill="#101c34" stroke="#247bff"/><text class="t" text-anchor="middle" y="6" font-size="14" font-weight="700">Py</text><text class="m" text-anchor="middle" y="52" font-size="14">Python</text></g>
<g transform="translate(0 -100)"><circle r="33" fill="#101c34" stroke="#247bff"/><text class="t" text-anchor="middle" y="5" font-size="11" font-weight="700">LG</text><text class="m" text-anchor="middle" y="52" font-size="14">LangGraph</text></g>
<g transform="translate(210 10)"><circle r="33" fill="#101c34" stroke="#ff354f"/><text class="t" text-anchor="middle" y="5" font-size="11" font-weight="700">LC</text><text class="m" text-anchor="middle" y="52" font-size="14">LangChain</text></g>
<g transform="translate(5 99)"><circle r="33" fill="#101c34" stroke="#ff354f"/><text class="t" text-anchor="middle" y="5" font-size="13" font-weight="700">MCP</text><text class="m" text-anchor="middle" y="52" font-size="14">MCP</text></g>
</g>
<path d="M635 92v245" stroke="#243552"/>
<text class="t" x="674" y="112" font-size="20" font-weight="800">CORE STACK</text>
<text class="m" x="674" y="143" font-size="14">AI &amp; orchestration</text>
<g><rect class="chip" x="674" y="157" width="145" height="36" rx="18"/><text class="t" x="746" y="180" text-anchor="middle" font-size="15">LangGraph</text><rect class="chip" x="831" y="157" width="145" height="36" rx="18"/><text class="t" x="903" y="180" text-anchor="middle" font-size="15">LangChain</text><rect class="chip" x="988" y="157" width="100" height="36" rx="18"/><text class="t" x="1038" y="180" text-anchor="middle" font-size="15">MCP</text></g>
<text class="m" x="674" y="230" font-size="14">Development</text><g><rect class="chip" x="674" y="244" width="112" height="36" rx="18"/><text class="t" x="730" y="267" text-anchor="middle" font-size="15">Python</text><rect class="chip" x="798" y="244" width="112" height="36" rx="18"/><text class="t" x="854" y="267" text-anchor="middle" font-size="15">Git</text><rect class="chip" x="922" y="244" width="145" height="36" rx="18"/><text class="t" x="994" y="267" text-anchor="middle" font-size="15">GitHub</text></g>
<text class="m" x="674" y="322" font-size="14">Built around practical workflows, testing, and iteration.</text>
